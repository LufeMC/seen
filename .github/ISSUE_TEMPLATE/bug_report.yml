name: Bug report
description: Report a reproducible problem.
body:
  - type: markdown
    attributes:
      value: Do not attach private captures, API keys, or your history database.
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: Describe what happened and what you expected.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: macOS version and Seen commit or release
    validations:
      required: true
